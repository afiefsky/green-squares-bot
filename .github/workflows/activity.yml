name: Natural GitHub Activity Bot

on:
  schedule:
    - cron: '0 6 * * *'    # 11:30 AM IST
    - cron: '0 12 * * *'   # 5:30 PM IST
    - cron: '45 15 * * *'  # 9:15 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify BOT_PAT secret is configured
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          if [ -z "$BOT_PAT" ]; then
            echo "::error::Missing repository secret BOT_PAT."
            echo "Create a fine-grained PAT with Contents read/write for this repo,"
            echo "then add it at Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important for rebase and push
          token: ${{ secrets.BOT_PAT }}
          persist-credentials: false

      - name: Configure git auth with BOT_PAT
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          git config --local --unset-all credential.helper || true
          git remote set-url origin "https://x-access-token:${BOT_PAT}@github.com/${{ github.repository }}.git"

      - name: Set up Git identity as afiefsky
        run: |
          git config user.name "afiefsky"
          git config user.email "23568070+afiefsky@users.noreply.github.com"

      - name: Install Python & pytz
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip install pytz

      - name: Run commit script
        run: |
          python3 commit.py

      - name: Stage files if changed (pre-pull)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "📌 Pre-pull changes found. Committing..."
            git add .
            git commit -m "📌 Pre-pull auto-commit to avoid rebase error" || echo "Nothing to commit"
          else
            echo "✅ No local changes to stage."
          fi

      - name: Pull and push changes
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          git config --local --unset-all credential.helper || true
          git remote set-url origin "https://x-access-token:${BOT_PAT}@github.com/${{ github.repository }}.git"
          git -c credential.helper= pull origin main --rebase
          AHEAD=$(git rev-list --count origin/main..HEAD)
          echo "Local branch is ahead by $AHEAD commit(s)."
          if [ $AHEAD -gt 0 ]; then
            echo "🔄 Changes detected. Pushing..."
            git -c credential.helper= push origin main
          else
            echo "✅ No new commits to push."
          fi
